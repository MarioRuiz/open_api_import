swagger: "2.0"
info:
  title: Shared Params API
  version: "1.0.0"
basePath: /api
paths:
  /items/{id}:
    parameters:
      - name: id
        in: path
        type: integer
        required: true
        description: Item ID
    get:
      operationId: getItem
      summary: Get item by ID
      parameters:
        - name: fields
          in: query
          type: string
          description: Fields to include
      responses:
        '200':
          description: Item found
    delete:
      operationId: deleteItem
      summary: Delete item by ID
      responses:
        '204':
          description: Item deleted
